name: Build apps

# every push to main builds all apps and publishes them as the "latest" release,
# which is what the download page on lamboorg.neocities.org links to
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/Lamboorg-Ultra-Setup.exe
            desktop/dist/Lamboorg-Ultra.dmg
            desktop/dist/Lamboorg-Ultra.AppImage
            desktop/dist/Lamboorg-Ultra.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD secrets (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          RAW_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # pasted secrets often pick up a line break or spaces: strip them
          export SIGNING_PASSWORD="$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if ! keytool -list -keystore "$SIGNING_KEYSTORE" -storepass "$SIGNING_PASSWORD" -alias lamboorg >/dev/null 2>&1; then
            echo "::error::SIGNING_PASSWORD doesn't open the keystore (length ${#SIGNING_PASSWORD}, expected 28). Paste the line from SIGNING_PASSWORD.txt again."; exit 1
          fi
          gradle assembleRelease --no-daemon
      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" Lamboorg-Ultra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Lamboorg-Ultra.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lamboorg Ultra 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            Download from https://lamboorg.neocities.org/#download
            The apps open the live site, so new features arrive without updating the app.
          files: out/*
