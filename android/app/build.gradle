plugins { id 'com.android.application' }

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'org.lamboorg.ultra'
    compileSdk 34
    defaultConfig {
        applicationId 'org.lamboorg.ultra'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    // every release is signed with the same Lamboorg key (kept in GitHub secrets), so updates install over the old app
    signingConfigs {
        release {
            storeFile file(System.getenv('SIGNING_KEYSTORE') ?: 'missing.keystore')
            storePassword System.getenv('SIGNING_PASSWORD')
            keyAlias 'lamboorg'
            keyPassword System.getenv('SIGNING_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
